<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fund Manager Time Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a111f;--panel:#111b30;--panel2:#16233d;--line:#243556;--txt:#e6edf7;--dim:#8fa3c2;--amber:#ffb020;--up:#4ade80;--down:#f87171;--cyan:#38bdf8;
--disp:'Barlow Condensed','Noto Sans TC','PingFang TC','Microsoft JhengHei','Arial Narrow',Impact,sans-serif;--mono:'IBM Plex Mono','Noto Sans TC',ui-monospace,Menlo,monospace;--body:'Inter','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:var(--body);-webkit-text-size-adjust:100%}
body{min-height:100vh;background:radial-gradient(1200px 500px at 50% -200px,#16305a 0,transparent 70%),var(--bg)}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
.tape{position:sticky;top:0;z-index:20;background:#050a14;border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;height:30px}
.tape .in{display:inline-block;padding-left:100%;animation:tape 38s linear infinite;font:600 12px/30px var(--mono);color:var(--amber);letter-spacing:.06em}
.tape .in span{margin-right:42px}.lang{position:absolute;right:0;top:0;height:30px;background:#050a14;padding:0 10px 0 14px;display:flex;align-items:center;gap:2px;box-shadow:-10px 0 10px #050a14}.lang button{font:600 12px var(--mono);padding:3px 8px;border-radius:4px;background:transparent;color:var(--dim)}.lang button.on{background:var(--amber);color:#1a1202}.up{color:var(--up)}.dn{color:var(--down)}
@keyframes tape{to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.tape .in{animation:none;padding-left:12px}}
#app{max-width:560px;margin:0 auto;padding:14px 14px 40px}
h1,h2,h3{font-family:var(--disp);font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.board{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.lbl{font:600 11px var(--mono);color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
.btn{display:block;width:100%;padding:15px;border-radius:10px;background:var(--amber);color:#1a1202;font:700 20px var(--disp);letter-spacing:.06em;text-transform:uppercase}
.btn:active{transform:translateY(1px)}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-size:16px;padding:11px}
.btn[disabled]{opacity:.45}
.hero h1{font-size:46px;line-height:.95;color:var(--amber)}.hero p{color:var(--dim);margin:10px 0}
.hero ul{margin:12px 0 16px 18px;color:var(--txt);line-height:1.6}
input[type=text]{width:100%;padding:13px;border-radius:10px;border:1px solid var(--line);background:#0b1426;color:var(--txt);font:500 16px var(--body);margin-bottom:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.rd{font:600 13px var(--mono);color:var(--dim);letter-spacing:.08em}
.clock{font:600 22px var(--mono);color:var(--amber);min-width:74px;text-align:right}.clock.low{color:var(--down)}
.bar{height:6px;border-radius:3px;background:#0b1426;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--amber);width:100%}
h2.head{font-size:30px;line-height:1.05;margin-bottom:12px}
.news li{margin:0 0 8px 18px;line-height:1.5;font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.tile{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px;border-left:4px solid var(--c)}
.tile b{display:block;font:600 11px var(--mono);color:var(--dim);letter-spacing:.08em}.tile em{font:600 18px var(--mono);font-style:normal}.tile small{display:block;font:500 12px var(--mono);margin-top:2px;color:var(--dim)}
.tile.wide{grid-column:span 2}
.view{border-top:1px solid var(--line);padding:10px 0}.view:first-of-type{border-top:0;padding-top:0}
.view .who{font-weight:600;font-size:14px}.view .meta{font-size:12px;color:var(--dim);margin:2px 0 4px}.view p{font-size:14px;line-height:1.5}
.chip{display:inline-block;font:600 10px var(--mono);letter-spacing:.08em;padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.chip.BULL{background:#12351f;color:var(--up)}.chip.CAUT{background:#3a1717;color:var(--down)}.chip.MIX{background:#2e2a14;color:var(--amber)}
.trade{position:sticky;bottom:0;z-index:10;background:#0d1730;border:1px solid var(--line);border-radius:14px 14px 0 0;padding:12px;margin:0 -4px;box-shadow:0 -8px 24px #000a}
.wl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}.wl b{font:600 20px var(--mono);color:var(--amber)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#0b1426;margin-bottom:10px}.stack i{display:block;height:100%;transition:width .15s}
.row{display:grid;grid-template-columns:78px 36px 1fr 36px 46px;align-items:center;gap:6px;margin-bottom:6px}
.row .nm{font:600 14px var(--disp);letter-spacing:.04em;text-transform:uppercase}.row .nm::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:6px}
.row button{height:34px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font:600 18px var(--mono)}
.row .v{font:600 14px var(--mono);text-align:right}
input[type=range]{width:100%;accent-color:var(--amber);height:28px}
.pre{display:flex;gap:6px;margin:6px 0 10px}.pre button{flex:1;padding:8px 4px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--dim)}
.rev .asset{display:grid;grid-template-columns:96px 1fr 64px;align-items:center;gap:8px;margin:9px 0}
.rev .asset .t{height:22px;background:#0b1426;border-radius:5px;position:relative;overflow:hidden}
.rev .asset .t i{position:absolute;top:0;bottom:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.rev .asset .n{font:600 15px var(--mono);text-align:right}.rev .asset .nm{font:600 15px var(--disp);text-transform:uppercase;letter-spacing:.04em}
.big{font:700 36px var(--mono);color:var(--amber)}.sub{color:var(--dim);font-size:13px}
.lb{width:100%;border-collapse:collapse;font-size:14px}.lb td{padding:8px 6px;border-top:1px solid var(--line)}.lb td:last-child{text-align:right;font-family:var(--mono)}.lb tr.me td{color:var(--amber);font-weight:600}
.card{background:linear-gradient(160deg,#18305a,#0f1c36 60%);border:2px solid var(--amber);border-radius:16px;padding:18px;margin-bottom:12px;text-align:center}
.card .k{font:600 11px var(--mono);color:var(--dim);letter-spacing:.16em}.card h2{font-size:42px;color:var(--amber);line-height:1;margin:6px 0}
.card p{font-size:15px;line-height:1.5;margin-top:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stats div{background:#0b1426;border-radius:8px;padding:8px 4px}.stats b{display:block;font:600 16px var(--mono)}.stats span{font-size:11px;color:var(--dim)}
details{border-top:1px solid var(--line);padding:9px 0}summary{cursor:pointer;font-weight:600;font-size:14px}details p,details li{font-size:14px;line-height:1.5;margin-top:6px}details ul{margin-left:18px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.chips span{font:500 11px var(--mono);padding:2px 6px;border-radius:4px;background:#0b1426;border-left:3px solid var(--c)}
.ask{border:1px dashed var(--amber);border-radius:10px;padding:10px 12px;color:var(--amber);font-size:14px;margin:12px 0}
.note{font-size:12px;color:var(--dim);line-height:1.55}
svg text{font-family:var(--mono)}
html[lang=zh-Hant] .lbl,html[lang=zh-Hant] .rd,html[lang=zh-Hant] .tile b,html[lang=zh-Hant] .card .k{letter-spacing:.03em}html[lang=zh-Hant] .tile b{font-size:12px}
@media (min-width:900px){#app{max-width:1080px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;align-items:start}.trade{position:sticky;top:44px;bottom:auto;border-radius:14px;margin:0}.top{margin-bottom:10px}}
</style>
</head>
<body>
<div class="tape"><div class="in" id="tape"></div><div class="lang"><button id="l-en">EN</button><button id="l-zh">中文</button></div></div>
<main id="app"></main>
<script>

</script>
</body>
</html>
